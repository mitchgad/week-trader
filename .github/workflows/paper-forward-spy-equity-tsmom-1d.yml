name: paper-forward-spy-equity-tsmom-1d

on:
  schedule:
    # Weekdays after US cash close (21:30 UTC ≈ 4:30pm ET standard time)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  forward-spy-equity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Gate 4 closed
        run: make gate4-closed
      - name: Paper forward monitor + live daily signal + anomaly check
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: |
          set -euo pipefail
          ID=spy-equity-tsmom-1d
          paper-forward "ID=${ID}" CHECK_ALERTS=1
          paper-forward "ID=${ID}" "ACTION=signal" "CLOSES=live"
          paper-forward "ID=${ID}" ACTION=alerts
      - name: Fail on critical forward anomalies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("paper/spy-equity-tsmom-1d/forward/alerts.json")
          if not path.is_file():
              raise SystemExit("alerts.json missing after scheduled run")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("severity") == "critical":
              raise SystemExit(f"critical forward anomalies: {report.get('alerts')}")
          print("forward anomaly severity:", report.get("severity"))
          PY
      - name: Upload forward artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-forward-spy-equity-tsmom-1d
          path: |
            paper/spy-equity-tsmom-1d/forward/status.json
            paper/spy-equity-tsmom-1d/forward/alerts.json
            paper/spy-equity-tsmom-1d/forward/events.jsonl
          if-no-files-found: ignore
