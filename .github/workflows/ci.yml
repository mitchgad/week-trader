name: ci

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Gate 4 closed
        run: make gate4-closed
      - name: Lint Jev questions (template)
        run: make lint-jev-questions ID=_template
      - name: Validate example manifest
        run: make data-validate
      - name: TypeSafe call allowlist
        run: |
          if rg -n "api\\.typesafe\\.ai|call_system_one" week_trader scripts \
            --glob '!week_trader/typesafe_client.py' \
            --glob '!week_trader/jev_gate.py'; then
            echo "Forbidden TypeSafe import/call site"
            exit 1
          fi
      - name: Pytest
        run: pytest -q
      - name: Record CI evidence for deployed SHA
        if: success()
        run: |
          python - <<'PY'
          from week_trader.ci_evidence import deployed_git_sha, write_local_ci_evidence_file

          sha = deployed_git_sha()
          write_local_ci_evidence_file(
              sha,
              implementation_audit_pass=True,
              unit_tests_pass=True,
              source="github_actions_ci",
          )
          print("recorded ci evidence for", sha)
          PY
      - name: jev-gate fails closed without API key
        run: |
          if jev-gate ID=_template GATE=spec; then
            echo "expected fail closed without TYPESAFE_API_KEY"
            exit 1
          fi
